<!DOCTYPE html>
<html>

<head>

<title>AI Car Price Predictor</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{

background:url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

}

body::before{

content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,.45);

}

.container{

position:relative;
z-index:1;

width:550px;

padding:35px;

border-radius:25px;

background:rgba(255,255,255,.18);

backdrop-filter:blur(18px);

box-shadow:0 15px 40px rgba(0,0,0,.4);

animation:float 5s infinite ease-in-out;

}

h1{

color:white;
text-align:center;
font-size:38px;
margin-bottom:10px;

}

.car{

font-size:70px;
text-align:center;
margin-bottom:10px;

animation:car 2s infinite;

}

p{

text-align:center;
color:white;
margin-bottom:25px;

}

select,input{

width:100%;
padding:14px;

border:none;

border-radius:12px;

margin-bottom:18px;

font-size:16px;

background:white;

transition:.3s;

}

select:hover,input:hover{

transform:scale(1.02);

}

select:focus,input:focus{

outline:none;

box-shadow:0 0 15px cyan;

transform:scale(1.03);

}

button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

font-size:20px;

font-weight:bold;

background:linear-gradient(45deg,#00c853,#64dd17);

color:white;

cursor:pointer;

transition:.4s;

}

button:hover{

transform:translateY(-4px);

box-shadow:0 10px 25px lime;

}

#result{

margin-top:25px;

text-align:center;

font-size:26px;

font-weight:bold;

color:yellow;

animation:fade .6s;

}

@keyframes float{

50%{

transform:translateY(-10px);

}

}

@keyframes fade{

from{

opacity:0;

transform:scale(.8);

}

to{

opacity:1;

transform:scale(1);

}

}

@keyframes car{

50%{

transform:translateX(10px);

}

}

</style>

</head>

<body>

<div class="container">

<div class="car">🚗</div>

<h1>AI Car Price Predictor</h1>

<p>Predict your used car price instantly</p>

<form id="predictForm">

<select name="company">

{% for company in companies %}
<option>{{company}}</option>
{% endfor %}

</select>

<select name="car_model">

{% for model in car_models %}
<option>{{model}}</option>
{% endfor %}

</select>

<select name="year">

{% for year in years %}
<option>{{year}}</option>
{% endfor %}

</select>

<select name="fuel_type">

{% for fuel in fuel_types %}
<option>{{fuel}}</option>
{% endfor %}

</select>

<input
type="number"
name="kms_driven"
placeholder="Enter Kilometers Driven"
required>

<button type="submit">
🚀 Predict Price
</button>

</form>

<div id="result"></div>

</div>

<script>

const form=document.getElementById("predictForm");

form.addEventListener("submit",function(e){

e.preventDefault();

document.getElementById("result").innerHTML="⏳ Predicting...";

fetch("/predict",{

method:"POST",

body:new FormData(form)

})

.then(response=>response.text())

.then(data=>{

document.getElementById("result").innerHTML="💰 Predicted Price : ₹ "+data;

})

.catch(()=>{

document.getElementById("result").innerHTML="❌ Something went wrong.";

});

});

</script>

</body>

</html>
