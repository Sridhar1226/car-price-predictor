<!DOCTYPE html>
<html>
<head>
    <title>Car Price Predictor</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
        }

        .container{
            width:500px;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h2{
            text-align:center;
        }

        select,input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            font-size:18px;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        h3{
            text-align:center;
            color:red;
        }

    </style>

</head>

<body>

<div class="container">

<h2>Car Price Predictor</h2>

<form id="predictForm">

<select name="company">

{% for company in companies %}
<option>{{company}}</option>
{% endfor %}

</select>

<select name="car_model">

{% for model in car_models %}
<option>{{model}}</option>
{% endfor %}

</select>

<select name="year">

{% for year in years %}
<option>{{year}}</option>
{% endfor %}

</select>

<select name="fuel_type">

{% for fuel in fuel_types %}
<option>{{fuel}}</option>
{% endfor %}

</select>

<input type="number" name="kms_driven" placeholder="Kilometers Driven">

<button type="submit">Predict Price</button>

</form>

<h3 id="result"></h3>

</div>

<script>

const form=document.getElementById("predictForm");

form.addEventListener("submit",function(e){

e.preventDefault();

fetch("/predict",{

method:"POST",

body:new FormData(form)

})

.then(response=>response.text())

.then(data=>{

document.getElementById("result").innerHTML="Predicted Price : ₹ "+data;

});

});

</script>

</body>
</html>
